services:
  sime:
    build: .
    ports:
      - "6969:6969"
    env_file:
      - .env.local
    volumes:
      - sime-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6969/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sime-data:
